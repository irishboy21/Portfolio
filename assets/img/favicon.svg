  <text x="28.4" y="37.4" text-anchor="middle" font-family="Garamond, 'Cormorant Garamond', 'Times New Roman', serif" font-size="21" letter-spacing="1" fill="#ffffff" opacity=".9">CC</text>
  <text x="27.5" y="36.5" text-anchor="middle" font-family="Garamond, 'Cormorant Garamond', 'Times New Roman', serif" font-size="21" letter-spacing="1" fill="#262626">CC</text>
